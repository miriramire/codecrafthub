<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #fef9f3 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            border-radius: 16px;
            color: white;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        /* Alert Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
            color: white;
        }

        .alert-error {
            background: linear-gradient(135deg, #EF4444 0%, #F87171 100%);
            color: white;
        }

        .alert-close {
            margin-left: auto;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .alert-close:hover {
            opacity: 1;
        }

        /* Form Section */
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #8B5CF6;
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        input, textarea, select {
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
        }

        .btn-error {
            background: linear-gradient(135deg, #EF4444 0%, #F87171 100%);
            color: white;
        }

        .btn-error:hover {
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        /* Courses Section */
        .courses-section h2 {
            color: #8B5CF6;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .course-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1F2937;
            word-break: break-word;
        }

        .course-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-not-started {
            background: #FEE2E2;
            color: #991B1B;
        }

        .status-in-progress {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .status-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .course-description {
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 60px;
        }

        .course-meta {
            display: flex;
            gap: 20px;
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .course-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .course-actions {
            display: flex;
            gap: 10px;
            border-top: 2px solid #F3F4F6;
            padding-top: 15px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            display: none;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            font-size: 1.6rem;
            color: #8B5CF6;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #9CA3AF;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #EF4444;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E5E7EB;
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 20px;
        }

        .loading-overlay p {
            color: #6B7280;
            font-size: 1.1rem;
        }

        /* Empty State */
        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            color: #374151;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .empty-state p {
            color: #9CA3AF;
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            header {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .form-section {
                padding: 20px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .course-meta {
                flex-direction: column;
                gap: 10px;
            }

            .modal {
                padding: 20px;
            }
        }

        /* Validation */
        .error-text {
            color: #EF4444;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        input.error, textarea.error, select.error {
            border-color: #EF4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>CodeCraftHub</h1>
            <p>Your Learning Management Platform</p>
        </header>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Add Course Form -->
        <section class="form-section">
            <h2>Add New Course</h2>
            <form id="courseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="courseName">Course Name *</label>
                        <input type="text" id="courseName" name="name" required placeholder="Enter course name">
                    </div>

                    <div class="form-group">
                        <label for="targetDate">Target Date *</label>
                        <input type="date" id="targetDate" name="target_date" required>
                    </div>

                    <div class="form-group">
                        <label for="courseStatus">Status *</label>
                        <select id="courseStatus" name="status" required>
                            <option value="">Select status</option>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="courseDescription">Description *</label>
                        <textarea id="courseDescription" name="description" required placeholder="Enter course description"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            Add Course
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Courses List -->
        <section class="courses-section">
            <h2>Your Courses</h2>
            <div id="coursesContainer">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <p>Loading courses...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Course</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editCourseId">

                <div class="form-group">
                    <label for="editName">Course Name *</label>
                    <input type="text" id="editName" name="name" required>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label for="editDescription">Description *</label>
                    <textarea id="editDescription" name="description" required></textarea>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label for="editTargetDate">Target Date *</label>
                    <input type="date" id="editTargetDate" name="target_date" required>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label for="editStatus">Status *</label>
                    <select id="editStatus" name="status" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-error" id="cancelEdit">Cancel</button>
                    <button type="submit" class="btn btn-success" id="updateBtn">Update Course</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:5000/api/courses';

        // State
        let courses = [];
        let isLoading = false;

        // DOM Elements
        const alertContainer = document.getElementById('alertContainer');
        const courseForm = document.getElementById('courseForm');
        const coursesContainer = document.getElementById('coursesContainer');
        const editModal = document.getElementById('editModal');
        const editForm = document.getElementById('editForm');
        const closeModalBtn = document.getElementById('closeModal');
        const cancelEditBtn = document.getElementById('cancelEdit');

        // Utility Functions
        function showAlert(message, type) {
            const alertId = Date.now();
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.id = `alert-${alertId}`;
            alertDiv.innerHTML = `
                <span>${message}</span>
                <button class="alert-close" onclick="closeAlert('${alertId}')">&times;</button>
            `;
            alertContainer.appendChild(alertDiv);

            // Auto remove after 5 seconds
            setTimeout(() => {
                const alertEl = document.getElementById(`alert-${alertId}`);
                if (alertEl) {
                    alertEl.remove();
                }
            }, 5000);
        }

        function closeAlert(alertId) {
            const alertEl = document.getElementById(`alert-${alertId}`);
            if (alertEl) {
                alertEl.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => alertEl.remove(), 300);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function getStatusClass(status) {
            const statusMap = {
                'Not Started': 'status-not-started',
                'In Progress': 'status-in-progress',
                'Completed': 'status-completed'
            };
            return statusMap[status] || 'status-not-started';
        }

        // API Functions
        async function fetchCourses() {
            try {
                isLoading = true;
                renderLoading();

                const response = await fetch(API_BASE_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                courses = await response.json();
                renderCourses();
            } catch (error) {
                console.error('Error fetching courses:', error);
                showAlert('Failed to load courses. Please check if the API server is running.', 'error');
                renderEmpty();
            } finally {
                isLoading = false;
            }
        }

        async function createCourse(courseData) {
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(courseData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP error! status: ${response.status}`);
                }

                const newCourse = await response.json();
                courses.push(newCourse);
                renderCourses();
                showAlert('Course added successfully!', 'success');
                courseForm.reset();
            } catch (error) {
                console.error('Error creating course:', error);
                showAlert(`Failed to add course: ${error.message}`, 'error');
            }
        }

        async function updateCourse(id, courseData) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(courseData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || `HTTP error! status: ${response.status}`);
                }

                const updatedCourse = await response.json();
                courses = courses.map(course => course.id === id ? updatedCourse : course);
                renderCourses();
                showAlert('Course updated successfully!', 'success');
                closeModal();
            } catch (error) {
                console.error('Error updating course:', error);
                showAlert(`Failed to update course: ${error.message}`, 'error');
            }
        }

        async function deleteCourse(id) {
            if (!confirm('Are you sure you want to delete this course?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                courses = courses.filter(course => course.id !== id);
                renderCourses();
                showAlert('Course deleted successfully!', 'success');
            } catch (error) {
                console.error('Error deleting course:', error);
                showAlert('Failed to delete course. Please try again.', 'error');
            }
        }

        // Render Functions
        function renderLoading() {
            coursesContainer.innerHTML = `
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <p>Loading courses...</p>
                </div>
            `;
        }

        function renderEmpty() {
            coursesContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <h3>No Courses Found</h3>
                    <p>Start by adding your first course above!</p>
                </div>
            `;
        }

        function renderCourses() {
            if (courses.length === 0) {
                renderEmpty();
                return;
            }

            coursesContainer.innerHTML = `
                <div class="courses-grid">
                    ${courses.map(course => `
                        <div class="course-card">
                            <div class="course-header">
                                <h3 class="course-name">${escapeHtml(course.name)}</h3>
                                <span class="course-status ${getStatusClass(course.status)}">
                                    ${escapeHtml(course.status)}
                                </span>
                            </div>
                            <p class="course-description">${escapeHtml(course.description)}</p>
                            <div class="course-meta">
                                <span>📅 Target: ${formatDate(course.target_date)}</span>
                                <span>🕐 Created: ${formatDate(course.created_at)}</span>
                            </div>
                            <div class="course-actions">
                                <button class="btn btn-success btn-small" onclick="openEditModal(${course.id})">
                                    Edit
                                </button>
                                <button class="btn btn-error btn-small" onclick="deleteCourse(${course.id})">
                                    Remove
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Modal Functions
        function openEditModal(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('editCourseId').value = course.id;
            document.getElementById('editName').value = course.name;
            document.getElementById('editDescription').value = course.description;
            document.getElementById('editTargetDate').value = course.target_date;
            document.getElementById('editStatus').value = course.status;

            editModal.classList.add('active');
        }

        function closeModal() {
            editModal.classList.remove('active');
        }

        // Event Listeners
        courseForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(courseForm);
            const courseData = {
                name: formData.get('name').trim(),
                description: formData.get('description').trim(),
                target_date: formData.get('target_date'),
                status: formData.get('status')
            };

            // Validation
            if (!courseData.name || !courseData.description || !courseData.target_date || !courseData.status) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            await createCourse(courseData);
        });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const courseId = document.getElementById('editCourseId').value;
            const formData = new FormData(editForm);
            const courseData = {
                name: formData.get('name').trim(),
                description: formData.get('description').trim(),
                target_date: formData.get('target_date'),
                status: formData.get('status')
            };

            // Validation
            if (!courseData.name || !courseData.description || !courseData.target_date || !courseData.status) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            await updateCourse(courseId, courseData);
        });

        closeModalBtn.addEventListener('click', closeModal);
        cancelEditBtn.addEventListener('click', closeModal);

        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && editModal.classList.contains('active')) {
                closeModal();
            }
        });

        // Make functions globally available
        window.openEditModal = openEditModal;
        window.deleteCourse = deleteCourse;
        window.closeAlert = closeAlert;

        // Initialize
        fetchCourses();

        // Set minimum date to today for target date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('targetDate').setAttribute('min', today);
    </script>
</body>
</html>
